services:
  api:
    build: .
    container_name: expense_tracker_api
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=expense_tracker
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - expense_tracker_network
    restart: unless-stopped
    volumes:
      - ./public:/app/public

  mysql:
    image: mysql:8.0
    container_name: expense_tracker_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=expense_tracker
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - expense_tracker_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:

networks:
  expense_tracker_network:
    driver: bridge
